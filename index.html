order-radius:0;box-shadow:none}.sparkle:before,.sparkle:after{content:'';position:absolute;inset:3px 0;background:linear-gradient(90deg,transparent,#d6deeb,transparent)}.sparkle:after{transform:rotate(90deg)}.motion-toggle{position:fixed;bottom:24px;right:28px;color:#8390a2;background:transparent;border:1px solid #8d9fb41f;border-radius:999px;padding:8px 13px;font:10px Bai,Arial,sans-serif;letter-spacing:.04em;cursor:pointer;transition:color .2s,border-color .2s}.motion-toggle:hover{color:#dee6f1;border-color:#8d9fb464}.motion-toggle:focus-visible{outline:2px solid #f3c541;outline-offset:4px}[hidden]{display:none!important}
@keyframes glitter{0%,100%{opacity:.13;transform:translateY(0) scale(.8)}45%{opacity:.75;transform:translateY(-6px) scale(1.1)}70%{opacity:.2;transform:translateY(-9px) scale(.9)}}@keyframes gleam{0%,100%{opacity:.45}50%{opacity:1}}@keyframes light-drift{0%,100%{transform:rotate(-32deg);opacity:.7}50%{transform:rotate(12deg);opacity:1}}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:no-preference){.glitter i{animation:glitter var(--duration) var(--delay) ease-in-out infinite}.circle-spark{animation:gleam 7s ease-in-out infinite}.circle-light{animation:light-drift 20s ease-in-out infinite}.center-copy{animation:arrive 1.4s .1s both}}
.motion-paused *{animation-play-state:paused!important}.motion-paused .center-copy{animation:none;opacity:1;transform:none}
@media(max-width:600px){.brand-circle{width:min(88vw,72svh,650px)}main{padding-bottom:50px}.motion-toggle{bottom:20px;right:20px;font-size:9px}p{letter-spacing:.19em}}
.orbit-motion{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;transform:rotate(45deg);--rainbow:conic-gradient(from 0deg,transparent 0deg 240deg,#8160ff00 247deg,#8160ff15 260deg,#9369ff45 278deg,#db75e87a 300deg,#ff86a9a6 316deg,#ffbf80bd 329deg,#f5e6a8d9 339deg,#9eeadfee 349deg,#b9ddffff 357deg,#f2e7ff 359.9deg,transparent 360deg)}.rainbow-trail,.rainbow-trail:after{position:absolute;inset:0;border-radius:50%;background:var(--rainbow);mask-image:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px),#000 calc(100% - 1px),transparent 100%)}.rainbow-trail:after{content:'';inset:-4px;filter:blur(4px);opacity:.7}.rainbow-trail{filter:drop-shadow(0 0 5px #b994ff70)}.circle-spark{top:0;left:50%;right:auto;width:clamp(26px,5.8cqi,38px);height:clamp(26px,5.8cqi,38px);padding:0;background:none;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px #c8b3ffad) drop-shadow(0 0 16px #85caff57)}.circle-spark svg{display:block;width:100%;height:100%;overflow:visible}.motion-paused *:before,.motion-paused *:after{animation-play-state:paused!important}
@keyframes orbit-star{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}
@media(prefers-reduced-motion:no-preference){.orbit-motion{animation:orbit-star 16s linear infinite}}
main{padding:36px 18px}.center-copy{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}.brand-emblem{display:block;width:43cqi;height:43cqi;object-fit:cover;border-radius:50%;clip-path:circle(48% at 49% 50%);margin-bottom:1cqi;filter:drop-shadow(0 0 18px #2066c732)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

</style>

  <button class="motion-toggle" type="button" aria-pressed="false" hidden>Pause motion</button>
  <script>
    const glitter = document.querySelector('.glitter');
    for (let index = 0; index < 62; index++) {
      const star = document.createElement('i');
      star.style.setProperty('--x', `${((index * 61.803 + 7) % 100).toFixed(2)}%`);
      star.style.setProperty('--y', `${((index * 37.719 + 13) % 100).toFixed(2)}%`);
      star.style.setProperty('--size', `${index % 9 === 0 ? 3 : index % 3 === 0 ? 2 : 1}px`);
      star.style.setProperty('--delay', `${-(index * .73 % 11).toFixed(2)}s`);
      star.style.setProperty('--duration', `${6 + index % 6}s`);
      if (index % 11 === 0) star.className = 'sparkle';
      glitter.append(star);
    }
    const preference = matchMedia('(prefers-reduced-motion: reduce)');
    const button = document.querySelector('.motion-toggle');
    let userPaused = false;
    function updateMotion() {
      const paused = userPaused || preference.matches;
      document.body.classList.toggle('motion-paused', paused);
      button.hidden = preference.matches;
      button.setAttribute('aria-pressed', String(paused));
      button.textContent = paused ? 'Resume motion' : 'Pause motion';
    }
    button.addEventListener('click', () => { userPaused = !userPaused; updateMotion(); });
    preference.addEventListener('change', updateMotion);
    updateMotion();
  </script>
