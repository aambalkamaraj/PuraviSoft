<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b12" />
  <meta name="description" content="PuraviSoft. A new chapter is coming soon..." />
  <title>PuraviSoft. — Coming soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23f3c541'/%3E%3C/svg%3E" />
  <link rel="preload" href="assets/regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="version-4.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="glitter" aria-hidden="true"></div>
  <main>
    <div class="brand-circle">
      <div class="orbit-motion" aria-hidden="true">
        <div class="rainbow-trail"></div>
        <span class="circle-spark"><svg viewBox="0 0 36 36" fill="none"><defs><linearGradient id="star-color" x1="4" y1="30" x2="30" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#79e9ff"/><stop offset=".4" stop-color="#d1b6ff"/><stop offset=".75" stop-color="#ffd0e5"/><stop offset="1" stop-color="#fff6c9"/></linearGradient></defs><path d="M17 3C19 12 22 15 31 17C22 19 19 22 17 31C15 22 12 19 3 17C12 15 15 12 17 3Z" fill="url(#star-color)"/><path d="M29 1L30.3 5.7L35 7L30.3 8.3L29 13L27.7 8.3L23 7L27.7 5.7L29 1Z" fill="#ede3ff"/></svg></span>
      </div>
      <div class="center-copy">
        <img class="brand-emblem" src="assets/puravisoft-emblem.png" width="617" height="611" alt="PuraviSoft blue horse and golden stars emblem" fetchpriority="high" />
        <h1>PuraviSoft<span>.</span></h1>
        <p>Coming soon<span class="ellipsis" aria-hidden="true">...</span></p>
      </div>
    </div>
  </main>
  <button class="motion-toggle" type="button" aria-pressed="false" hidden>Pause motion</button>
  <script>
    const glitter = document.querySelector('.glitter');
    for (let index = 0; index < 62; index++) {
      const star = document.createElement('i');
      star.style.setProperty('--x', `${((index * 61.803 + 7) % 100).toFixed(2)}%`);
      star.style.setProperty('--y', `${((index * 37.719 + 13) % 100).toFixed(2)}%`);
      star.style.setProperty('--size', `${index % 9 === 0 ? 3 : index % 3 === 0 ? 2 : 1}px`);
      star.style.setProperty('--delay', `${-(index * .73 % 11).toFixed(2)}s`);
      star.style.setProperty('--duration', `${6 + index % 6}s`);
      if (index % 11 === 0) star.className = 'sparkle';
      glitter.append(star);
    }
    const preference = matchMedia('(prefers-reduced-motion: reduce)');
    const button = document.querySelector('.motion-toggle');
    let userPaused = false;
    function updateMotion() {
      const paused = userPaused || preference.matches;
      document.body.classList.toggle('motion-paused', paused);
      button.hidden = preference.matches;
      button.setAttribute('aria-pressed', String(paused));
      button.textContent = paused ? 'Resume motion' : 'Pause motion';
    }
    button.addEventListener('click', () => { userPaused = !userPaused; updateMotion(); });
    preference.addEventListener('change', updateMotion);
    updateMotion();
  </script>
</body>
</html>
